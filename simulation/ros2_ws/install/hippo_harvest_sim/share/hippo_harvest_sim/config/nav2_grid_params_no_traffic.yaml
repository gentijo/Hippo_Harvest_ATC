bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    local_frame: map
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    current_progress_checker: "progress_checker"
    current_goal_checker: "goal_checker"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 45.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.24
      yaw_goal_tolerance: 3.2
      stateful: false
    FollowPath.plugin: "dwb_core::DWBLocalPlanner"
    FollowPath.debug_trajectory_details: false
    FollowPath.min_vel_x: 0.0
    FollowPath.max_vel_x: 0.10
    FollowPath.min_speed_xy: 0.0
    FollowPath.max_speed_xy: 0.10
    FollowPath.min_speed_theta: 0.0
    FollowPath.max_vel_theta: 0.6
    FollowPath.acc_lim_x: 0.5
    FollowPath.decel_lim_x: -0.5
    FollowPath.acc_lim_theta: 1.0
    FollowPath.decel_lim_theta: -1.0
    FollowPath.vx_samples: 8
    FollowPath.vy_samples: 1
    FollowPath.vtheta_samples: 12
    FollowPath.lookahead_time: 1.5
    FollowPath.sim_time: 1.0
    FollowPath.transform_tolerance: 0.2
    FollowPath.xy_goal_tolerance: 0.24
    FollowPath.trans_stopped_velocity: 0.01
    FollowPath.short_circuit_trajectory_evaluation: true
    FollowPath.stateful: false
    FollowPath.critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
    FollowPath.BaseObstacle.scale: 8.0
    FollowPath.PathAlign.scale: 12.0
    FollowPath.PathAlign.forward_point_distance: 0.10
    FollowPath.GoalAlign.scale: 8.0
    FollowPath.GoalAlign.forward_point_distance: 0.10
    FollowPath.PathDist.scale: 18.0
    FollowPath.GoalDist.scale: 12.0
    FollowPath.RotateToGoal.scale: 16.0
    FollowPath.RotateToGoal.slowing_factor: 5.0
    FollowPath.RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025
      robot_radius: 0.05
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.24
        cost_scaling_factor: 2.0

map_server:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.025
      robot_radius: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.24
        cost_scaling_factor: 2.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "planner_server", "controller_server", "behavior_server", "bt_navigator"]
